name: Stash 🐹

on:
  schedule:
    - cron: "*/15 * * * *"  # напоминания и подстраховка; сообщения будит Cloudflare Worker сразу
  workflow_dispatch:

concurrency:
  group: stash
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  hamster:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STASH_MODE: cloud
      TZ: ${{ vars.STASH_TZ || 'UTC' }}
      NUDGE_HOUR: ${{ vars.NUDGE_HOUR || '19' }}
      REMINDER_HOUR: ${{ vars.REMINDER_HOUR || '10' }}
      REMINDER_WEEKDAY: ${{ vars.REMINDER_WEEKDAY || '1' }}
      AGENT_MODEL: ${{ vars.AGENT_MODEL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
      STASH_DATA_KEY: ${{ secrets.STASH_DATA_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      STASH_RESULTS: norka/results
      STASH_QUEUE_URL: ${{ vars.STASH_QUEUE_URL }}
      STASH_QUEUE_SECRET: ${{ secrets.STASH_QUEUE_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: true

      - name: Достать норку (ветка norka-data)
        run: |
          git config user.name "stash-hamster[bot]"
          git config user.email "stash-hamster@users.noreply.github.com"
          if git fetch origin norka-data 2>/dev/null; then
            git worktree add -B norka-data norka origin/norka-data
          else
            git worktree add --orphan -b norka-data norka
          fi
          mkdir -p data

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true

      - run: uv sync --frozen --extra voice

      - name: Кеш модели Whisper (голосовые)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Расшифровать
        run: |
          if [ -f norka/norka.enc ]; then
            uv run python crypto_store.py decrypt norka/norka.enc data/norka.json
          fi
          touch data/.loaded   # норка прочитана: дальше её можно сохранять даже при сбое прогона

      - name: Хомяк просыпается
        run: uv run python cloud_run.py

      - name: Спрятать норку обратно
        if: always()
        run: |
          # Сохраняем и после сбоя (находка не потеряется), но только если норка была успешно прочитана.
          [ -f data/.loaded ] && [ -f data/norka.json ] || { echo "норка не загружалась, не трогаю"; exit 0; }
          new_sha=$(sha256sum data/norka.json | cut -d' ' -f1)
          old_sha=$(cat norka/norka.sha 2>/dev/null || true)
          if [ "$new_sha" != "$old_sha" ]; then
            uv run python crypto_store.py encrypt data/norka.json norka/norka.enc
            echo "$new_sha" > norka/norka.sha
          fi
          saved=1
          cd norka
          git add -A
          if git diff --cached --quiet; then
            echo "без изменений"
          else
            git commit -q -m "🐹 норка обновлена"
            saved=0
            for i in 1 2 3 4 5; do
              git pull -q --rebase origin norka-data 2>/dev/null || true
              if git push -q origin HEAD:norka-data; then saved=1; break; fi
              sleep $((i * 3))
            done
          fi
          cd ..
          [ "$saved" = 1 ] || exit 1
          # Только теперь чистим очередь: если что-то упало раньше, сообщения останутся и обработаются снова.
          uv run python cloud_run.py --confirm
